workflows:
  android-release:
    name: Barbar365 Release Build

    environment:
      java: 17

    scripts:
      - name: Grant Gradle permission
        script: |
          chmod +x gradlew

      - name: Build Release APK
        script: |
          ./gradlew assembleRelease

    artifacts:
      - app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - your@email.com
